# Default training configuration for multi-domain tactical scenario simulation MARL

curriculum:
  levels: [1, 2, 3, 4, 5]
  episodes_per_level: [500, 500, 800, 1000, 2000]
  horizons:
    1: 200
    2: 200
    3: 250
    4: 300
    5: 350
  advance_threshold: 0.60
  evaluation_window: 50

league:
  league_size: 20
  scripted_prob: 0.20
  league_save_interval: 50

training:
  total_iterations: 5000
  rollout_steps: 256
  num_parallel_envs: 8
  ppo_epochs: 10
  eval_interval: 100
  eval_episodes: 1000
  checkpoint_interval: 100
  log_interval: 10

staged:
  stage_a_freeze_at: "L5"
  stage_b_start_at: 0

paths:
  checkpoint_dir: "checkpoints/"
  log_dir: "logs/"
  metrics_csv: "logs/metrics.csv"
  league_dir: "checkpoints/league/"
  stage_a_dir: "checkpoints/stage_a/"
  stage_b_dir: "checkpoints/stage_b/"
  final_dir: "checkpoints/final/"
