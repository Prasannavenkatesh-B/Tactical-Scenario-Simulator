<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRDO TSS — React Tactical Combat Simulator (H-MARL 6,000 Iterations)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; image-rendering: auto; }
    .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    .glow-sky { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    .glow-amber { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
    .glow-rose { box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
  </style>
</head>
<body>
  <!-- Root React Mounting Point -->
  <div id="root"></div>

  <!-- React Application Source Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // =========================================================================
    // MAIN REACT APP COMPONENT
    // =========================================================================
    function TacticalSimulatorApp() {
      // 1. Theme State: 'dark' | 'light'
      const [theme, setTheme] = useState('dark');

      // 2. Map & Environment State
      const [mapTerrain, setMapTerrain] = useState('desert'); // archipelago | desert | mountain | ocean

      // 3. Simulation Playback State
      const [isPlaying, setIsPlaying] = useState(true);
      const [simSpeed, setSimSpeed] = useState(1.0);
      const [stepCount, setStepCount] = useState(0);
      const [simTime, setSimTime] = useState(0);

      // 4. Tactical Overlays
      const [toggles, setToggles] = useState({
        radar: true,
        wez: true,
        trails: true,
        grid: true,
        terrain: true
      });

      // 5. Army Fleet Customizer Config
      const [fleetConfig, setFleetConfig] = useState({
        blue: { ac1: 1, ac2: 1, tank: 1, ship: 1 },
        red:   { ac1: 1, ac2: 1, tank: 1, ship: 1 }
      });
      const [isCustomizerOpen, setIsCustomizerOpen] = useState(false);

      // 6. Selected Unit & Manual Practice Override State
      const [selectedUnitId, setSelectedUnitId] = useState('blue_air_1');
      const [manualOverride, setManualOverride] = useState(true); // default true for instant practice!

      // 7. Toast Notification State
      const [toast, setToast] = useState({ text: '', visible: false });
      const toastTimerRef = useRef(null);

      // 8. Simulation Data Refs (High frequency 50-60 Hz loop)
      const entitiesRef = useRef([]);
      const projectilesRef = useRef([]);
      const explosionsRef = useRef([]);
      const damageTextsRef = useRef([]);
      const canvasRef = useRef(null);
      const MAP_KM = 100.0;

      // Toast notification helper
      const showToast = useCallback((msg) => {
        setToast({ text: msg, visible: true });
        clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => {
          setToast(prev => ({ ...prev, visible: false }));
        }, 1800);
      }, []);

      // Build initial fleet based on fleetConfig & mapTerrain
      const initFleet = useCallback((config, terrain) => {
        projectilesRef.current = [];
        explosionsRef.current = [];
        damageTextsRef.current = [];
        const result = [];

        // Blue Forces (West side: X = 15 to 32 km)
        let bAir = 1;
        for (let i = 0; i < config.blue.ac1; i++) {
          const yPos = 14 + (i * 30) / Math.max(1, config.blue.ac1);
          result.push({
            id: `blue_air_${bAir++}`, team: 'blue', domain: 'air', class: 'AC1 Air Fighter',
            x: 18 + (i % 2) * 8, y: yPos, heading: 90, speed: 480, alt: 9.0,
            health: 100, maxHealth: 100, ammo: 250, missiles: 4, intent: 'BVR_FOX3_ENGAGE', trail: []
          });
        }
        for (let i = 0; i < config.blue.ac2; i++) {
          const yPos = 20 + (i * 26) / Math.max(1, config.blue.ac2);
          result.push({
            id: `blue_air_${bAir++}`, team: 'blue', domain: 'air', class: 'AC2 Interceptor',
            x: 12 + (i % 2) * 6, y: yPos, heading: 90, speed: 430, alt: 11.0,
            health: 100, maxHealth: 100, ammo: 200, missiles: 2, intent: 'RADAR_SWEEP_SCAN', trail: []
          });
        }
        let bTank = 1;
        for (let i = 0; i < config.blue.tank; i++) {
          const yPos = 50 + (i * 20) / Math.max(1, config.blue.tank);
          result.push({
            id: `blue_tank_${bTank++}`, team: 'blue', domain: 'ground', class: 'SAM Mobile Tank',
            x: 20 + (i % 3) * 6, y: yPos, heading: 45, speed: 35, alt: 0.1,
            health: 120, maxHealth: 120, ammo: 80, missiles: 8, intent: 'MUTUAL_AIR_DEFENSE', trail: []
          });
        }
        let bShip = 1;
        for (let i = 0; i < config.blue.ship; i++) {
          const yPos = 76 + (i * 15) / Math.max(1, config.blue.ship);
          result.push({
            id: `blue_ship_${bShip++}`, team: 'blue', domain: 'sea',
            class: terrain === 'desert' ? 'Heavy Land Cruiser' : 'Naval Combat Frigate',
            x: 16 + (i % 3) * 8, y: yPos, heading: 60, speed: 28, alt: 0.0,
            health: 180, maxHealth: 180, ammo: 150, missiles: 16, intent: 'FLEET_ESCORT_SCREEN', trail: []
          });
        }

        // Red Forces (East side: X = 68 to 86 km)
        let rAir = 1;
        for (let i = 0; i < config.red.ac1; i++) {
          const yPos = 14 + (i * 30) / Math.max(1, config.red.ac1);
          result.push({
            id: `red_air_${rAir++}`, team: 'red', domain: 'air', class: 'AC1 Air Fighter',
            x: 82 - (i % 2) * 8, y: yPos, heading: 270, speed: 480, alt: 9.0,
            health: 100, maxHealth: 100, ammo: 250, missiles: 4, intent: 'AGGRESSIVE_INTERCEPT', trail: []
          });
        }
        for (let i = 0; i < config.red.ac2; i++) {
          const yPos = 20 + (i * 26) / Math.max(1, config.red.ac2);
          result.push({
            id: `red_air_${rAir++}`, team: 'red', domain: 'air', class: 'AC2 Interceptor',
            x: 88 - (i % 2) * 6, y: yPos, heading: 270, speed: 430, alt: 11.0,
            health: 100, maxHealth: 100, ammo: 200, missiles: 2, intent: 'STANDOFF_MISSILE_FIRE', trail: []
          });
        }
        let rTank = 1;
        for (let i = 0; i < config.red.tank; i++) {
          const yPos = 50 + (i * 20) / Math.max(1, config.red.tank);
          result.push({
            id: `red_tank_${rTank++}`, team: 'red', domain: 'ground', class: 'SAM Mobile Tank',
            x: 80 - (i % 3) * 6, y: yPos, heading: 225, speed: 30, alt: 0.1,
            health: 120, maxHealth: 120, ammo: 80, missiles: 8, intent: 'FORTIFIED_SAM_AMBUSH', trail: []
          });
        }
        let rShip = 1;
        for (let i = 0; i < config.red.ship; i++) {
          const yPos = 76 + (i * 15) / Math.max(1, config.red.ship);
          result.push({
            id: `red_ship_${rShip++}`, team: 'red', domain: 'sea',
            class: terrain === 'desert' ? 'Armored Land Cruiser' : 'Missile Corvette',
            x: 84 - (i % 3) * 8, y: yPos, heading: 240, speed: 30, alt: 0.0,
            health: 180, maxHealth: 180, ammo: 150, missiles: 12, intent: 'STANDOFF_FIRE', trail: []
          });
        }

        entitiesRef.current = result;
        const firstBlue = result.find(e => e.team === 'blue');
        if (firstBlue) setSelectedUnitId(firstBlue.id);
        setStepCount(0);
        setSimTime(0);
      }, []);

      // Initial Fleet Setup
      useEffect(() => {
        initFleet(fleetConfig, mapTerrain);
      }, []);

      // Get Active Selected Unit
      const activeUnit = entitiesRef.current.find(e => e.id === selectedUnitId) || entitiesRef.current[0];

      // =======================================================================
      // WEAPONS FIRE & MANUAL CONTROLS
      // =======================================================================
      const fireWeapon = useCallback((category) => {
        const unit = entitiesRef.current.find(e => e.id === selectedUnitId);
        if (!unit || unit.health <= 0) return;

        if (category === 'primary') {
          if (unit.ammo <= 0) {
            showToast(`⚠️ ${unit.id}: Ammo Depleted!`);
            return;
          }
          unit.ammo = Math.max(0, unit.ammo - (unit.domain === 'ground' ? 1 : 5));
          const rad = (unit.heading * Math.PI) / 180;
          projectilesRef.current.push({
            x: unit.x + Math.sin(rad) * 1.5,
            y: unit.y - Math.cos(rad) * 1.5,
            heading: unit.heading + (Math.random() - 0.5) * 4,
            speed: unit.domain === 'air' ? 1400 : (unit.domain === 'ground' ? 1100 : 1200),
            damage: unit.domain === 'air' ? 14 : (unit.domain === 'ground' ? 35 : 28),
            team: unit.team,
            type: 'bullet',
            life: 30,
            sourceId: unit.id
          });
          showToast(`💥 ${unit.id} Fired ${unit.domain === 'ground' ? '120mm Tank Shell' : (unit.domain === 'sea' ? '76mm Gun' : '20mm Vulcan')}`);

        } else if (category === 'secondary') {
          if (unit.missiles <= 0) {
            showToast(`⚠️ ${unit.id}: Out of Missiles!`);
            return;
          }
          unit.missiles = Math.max(0, unit.missiles - 1);
          const rad = (unit.heading * Math.PI) / 180;
          projectilesRef.current.push({
            x: unit.x + Math.sin(rad) * 2.5,
            y: unit.y - Math.cos(rad) * 2.5,
            heading: unit.heading,
            speed: 850,
            damage: unit.domain === 'air' ? 50 : (unit.domain === 'ground' ? 65 : 75),
            team: unit.team,
            type: 'missile',
            life: 95,
            trail: [],
            sourceId: unit.id
          });
          showToast(`🚀 ${unit.id} Launched ${unit.domain === 'ground' ? 'SAM Missile' : (unit.domain === 'sea' ? 'Cruise Missile' : 'Fox-3 Missile')}!`);
        }
      }, [selectedUnitId, showToast]);

      const steerManual = useCallback((action) => {
        setManualOverride(true);
        const unit = entitiesRef.current.find(e => e.id === selectedUnitId);
        if (!unit || unit.health <= 0) return;

        if (action === 'left') {
          const turnStep = unit.domain === 'air' ? 12 : (unit.domain === 'ground' ? 15 : 6);
          unit.heading = (unit.heading - turnStep + 360) % 360;
        } else if (action === 'right') {
          const turnStep = unit.domain === 'air' ? 12 : (unit.domain === 'ground' ? 15 : 6);
          unit.heading = (unit.heading + turnStep) % 360;
        } else if (action === 'fwd') {
          const maxSpd = unit.domain === 'air' ? 950 : (unit.domain === 'ground' ? 60 : 40);
          unit.speed = Math.min(unit.speed + (unit.domain === 'air' ? 60 : 5), maxSpd);
        } else if (action === 'back') {
          const minSpd = unit.domain === 'air' ? 150 : 0;
          unit.speed = Math.max(unit.speed - (unit.domain === 'air' ? 60 : 5), minSpd);
        }
      }, [selectedUnitId]);

      // Keyboard Controls Handler
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

          if (e.code === 'KeyW' || e.code === 'ArrowUp') steerManual('fwd');
          else if (e.code === 'KeyS' || e.code === 'ArrowDown') steerManual('back');
          else if (e.code === 'KeyA' || e.code === 'ArrowLeft') steerManual('left');
          else if (e.code === 'KeyD' || e.code === 'ArrowRight') steerManual('right');
          else if (e.code === 'Space') {
            e.preventDefault();
            fireWeapon('primary');
          } else if (e.code === 'KeyF' || e.code === 'KeyR') {
            fireWeapon('secondary');
          } else if (e.code === 'KeyM') {
            setManualOverride(prev => !prev);
          } else if (e.code.startsWith('Digit')) {
            const digit = parseInt(e.code.replace('Digit', '')) - 1;
            const blueUnits = entitiesRef.current.filter(u => u.team === 'blue');
            if (blueUnits[digit]) setSelectedUnitId(blueUnits[digit].id);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [steerManual, fireWeapon]);

      // =======================================================================
      // HIGH-SPEED 60 FPS PHYSICS & CANVAS RENDER LOOP
      // =======================================================================
      useEffect(() => {
        let animationFrameId;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const renderLoop = () => {
          const width = canvas.width = canvas.parentElement.clientWidth;
          const height = canvas.height = canvas.parentElement.clientHeight;

          const kmToCanvas = (xKm, yKm) => ({
            x: (xKm / MAP_KM) * width,
            y: (yKm / MAP_KM) * height
          });

          // -------------------------------------------------------------
          // 1. PHYSICS UPDATE STEP
          // -------------------------------------------------------------
          if (isPlaying) {
            setStepCount(prev => prev + 1);
            setSimTime(prev => +(prev + 0.1).toFixed(1));

            // Update Projectiles
            const projs = projectilesRef.current;
            for (let i = projs.length - 1; i >= 0; i--) {
              const p = projs[i];
              const rad = (p.heading * Math.PI) / 180;
              p.x += Math.sin(rad) * p.speed * 0.04;
              p.y -= Math.cos(rad) * p.speed * 0.04;
              p.life--;

              if (p.type === 'missile' && p.trail) {
                p.trail.push({ x: p.x, y: p.y });
                if (p.trail.length > 12) p.trail.shift();
              }

              // Check Target Hits
              entitiesRef.current.forEach(target => {
                if (target.team !== p.team && target.health > 0) {
                  const d = Math.hypot(target.x - p.x, target.y - p.y);
                  const threshold = target.domain === 'sea' ? 4.5 : (target.domain === 'ground' ? 3.5 : 2.5);

                  if (d < threshold) {
                    target.health = Math.max(0, target.health - p.damage);
                    p.life = 0;

                    explosionsRef.current.push({
                      x: target.x, y: target.y,
                      radius: p.type === 'missile' ? 24 : 12,
                      maxRadius: p.type === 'missile' ? 42 : 20,
                      color: p.type === 'missile' ? '#f97316' : '#fef08a',
                      life: 25
                    });

                    damageTextsRef.current.push({
                      x: target.x, y: target.y - 2,
                      text: `-${p.damage} HP`,
                      color: '#f43f5e',
                      life: 35
                    });

                    if (target.health <= 0) {
                      showToast(`💥 DESTROYED: ${target.id}`);
                      explosionsRef.current.push({
                        x: target.x, y: target.y,
                        radius: 12, maxRadius: 65,
                        color: '#ef4444', life: 45
                      });
                    }
                  }
                }
              });

              if (p.life <= 0 || p.x < 0 || p.x > MAP_KM || p.y < 0 || p.y > MAP_KM) {
                projs.splice(i, 1);
              }
            }

            // Update Units
            entitiesRef.current.forEach(e => {
              if (e.health <= 0) return;
              const isManual = (e.id === selectedUnitId && manualOverride);

              if (!isManual) {
                // Autonomous combat maneuvers
                let closestEnemy = null;
                let minDist = 999;
                entitiesRef.current.forEach(other => {
                  if (other.team !== e.team && other.health > 0) {
                    const dist = Math.hypot(other.x - e.x, other.y - e.y);
                    if (dist < minDist) {
                      minDist = dist;
                      closestEnemy = other;
                    }
                  }
                });

                if (closestEnemy) {
                  const targetAngle = (Math.atan2(closestEnemy.x - e.x, -(closestEnemy.y - e.y)) * 180) / Math.PI;
                  let diff = targetAngle - e.heading;
                  while (diff < -180) diff += 360;
                  while (diff > 180) diff -= 360;

                  const turnRate = e.domain === 'air' ? 4.0 : (e.domain === 'ground' ? 7.0 : 2.5);
                  e.heading += Math.sign(diff) * Math.min(Math.abs(diff), turnRate);

                  // Auto Fire
                  const fireRange = e.domain === 'air' ? 30 : (e.domain === 'ground' ? 40 : 45);
                  if (Math.abs(diff) < 18 && minDist < fireRange) {
                    if (minDist < 15 && Math.random() < 0.05) fireWeapon('primary');
                    else if (Math.random() < 0.02) fireWeapon('secondary');
                  }
                }
              }

              // Kinematics
              const rad = (e.heading * Math.PI) / 180;
              const speedScale = e.domain === 'air' ? 0.032 : (e.domain === 'ground' ? 0.012 : 0.009);
              e.x += Math.sin(rad) * (e.speed / 100) * speedScale * simSpeed;
              e.y -= Math.cos(rad) * (e.speed / 100) * speedScale * simSpeed;

              // Bounds
              if (e.x < 4) { e.x = 4; e.heading = 90; }
              if (e.x > MAP_KM - 4) { e.x = MAP_KM - 4; e.heading = 270; }
              if (e.y < 4) { e.y = 4; e.heading = 180; }
              if (e.y > MAP_KM - 4) { e.y = MAP_KM - 4; e.heading = 0; }

              // Trails
              if (Math.random() < 0.3) {
                e.trail.push({ x: e.x, y: e.y });
                if (e.trail.length > 25) e.trail.shift();
              }
            });

            // Explosions & Damage text life
            for (let i = explosionsRef.current.length - 1; i >= 0; i--) {
              const exp = explosionsRef.current[i];
              exp.radius += (exp.maxRadius - exp.radius) * 0.15;
              exp.life--;
              if (exp.life <= 0) explosionsRef.current.splice(i, 1);
            }
            for (let i = damageTextsRef.current.length - 1; i >= 0; i--) {
              const dt = damageTextsRef.current[i];
              dt.y -= 0.1;
              dt.life--;
              if (dt.life <= 0) damageTextsRef.current.splice(i, 1);
            }
          }

          // -------------------------------------------------------------
          // 2. CANVAS RENDERING (THEME AWARE: LIGHT VS DARK)
          // -------------------------------------------------------------
          const isLight = (theme === 'light');

          // Draw Topography
          if (toggles.terrain) {
            if (mapTerrain === 'desert') {
              // Desert: Light vs Dark
              ctx.fillStyle = isLight ? '#f2e1c9' : '#2b1a0e';
              ctx.fillRect(0, 0, width, height);

              // Dunes
              ctx.fillStyle = isLight ? '#e6cfb0' : '#45260f';
              ctx.beginPath();
              ctx.moveTo(0, height * 0.28);
              ctx.bezierCurveTo(width * 0.35, height * 0.15, width * 0.65, height * 0.45, width, height * 0.32);
              ctx.lineTo(width, height * 0.68);
              ctx.bezierCurveTo(width * 0.65, height * 0.78, width * 0.25, height * 0.55, 0, height * 0.62);
              ctx.fill();

              ctx.strokeStyle = isLight ? '#d97706' : '#b45309';
              ctx.lineWidth = 3;
              ctx.stroke();

              // Mesa Rock Escarpment
              const mesa = kmToCanvas(50, 24);
              ctx.fillStyle = isLight ? '#d4b38a' : '#3b1803';
              ctx.beginPath();
              ctx.roundRect(mesa.x - 70, mesa.y - 40, 140, 80, 16);
              ctx.fill();
              ctx.strokeStyle = isLight ? '#b45309' : '#9a3412';
              ctx.lineWidth = 2;
              ctx.stroke();
              ctx.fillStyle = isLight ? '#78350f' : '#fde68a';
              ctx.font = 'bold 10px monospace';
              ctx.fillText('⛰️ MESA ROCK ESCARPMENT (ALT: 1,800m)', mesa.x - 85, mesa.y - 45);

              // Blue FOB Alfa Airbase
              const fba = kmToCanvas(15, 50);
              ctx.fillStyle = isLight ? '#e2e8f0' : '#1e293b';
              ctx.fillRect(fba.x - 45, fba.y - 18, 90, 36);
              ctx.strokeStyle = '#0284c7';
              ctx.lineWidth = 2;
              ctx.strokeRect(fba.x - 45, fba.y - 18, 90, 36);
              ctx.fillStyle = '#0284c7';
              ctx.font = 'bold 9px monospace';
              ctx.fillText('BLUE AIRBASE [FOB ALFA]', fba.x - 50, fba.y - 24);

              // Red Fortress Bastion
              const rfb = kmToCanvas(85, 50);
              ctx.fillStyle = isLight ? '#fee2e2' : '#2a0808';
              ctx.fillRect(rfb.x - 40, rfb.y - 20, 80, 40);
              ctx.strokeStyle = '#e11d48';
              ctx.lineWidth = 2;
              ctx.strokeRect(rfb.x - 40, rfb.y - 20, 80, 40);
              ctx.fillStyle = '#e11d48';
              ctx.font = 'bold 9px monospace';
              ctx.fillText('RED BASTION FORTRESS', rfb.x - 50, rfb.y - 26);

            } else if (mapTerrain === 'mountain') {
              // Mountain: Light vs Dark
              ctx.fillStyle = isLight ? '#e2e8f0' : '#0a101d';
              ctx.fillRect(0, 0, width, height);

              // 3 Mountain Peaks
              const peaks = [
                { xKm: 50, yKm: 22, r: 85, label: 'MT. TRISUL (6,800m)' },
                { xKm: 48, yKm: 50, r: 105, label: 'NANDA DEVI SPINE (7,400m)' },
                { xKm: 52, yKm: 78, r: 90, label: 'KANCHENJUNGA RIDGE (7,100m)' }
              ];
              peaks.forEach(p => {
                const pt = kmToCanvas(p.xKm, p.yKm);
                ctx.fillStyle = isLight ? '#cbd5e1' : '#1e293b';
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = isLight ? '#94a3b8' : '#334155';
                ctx.beginPath();
                ctx.arc(pt.x - 6, pt.y - 6, p.r * 0.7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(pt.x - 12, pt.y - 12, p.r * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Masking zone
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, p.r * 1.25, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = isLight ? '#334155' : '#cbd5e1';
                ctx.font = 'bold 9px monospace';
                ctx.fillText(`⛰️ ${p.label}`, pt.x - 55, pt.y - p.r - 8);
              });

              // River Gorge
              ctx.strokeStyle = '#0284c7';
              ctx.lineWidth = 3.5;
              ctx.beginPath();
              ctx.moveTo(width * 0.3, 0);
              ctx.bezierCurveTo(width * 0.45, height * 0.35, width * 0.42, height * 0.65, width * 0.6, height);
              ctx.stroke();

            } else if (mapTerrain === 'ocean') {
              // Ocean: Light vs Dark
              ctx.fillStyle = isLight ? '#e0f2fe' : '#020d24';
              ctx.fillRect(0, 0, width, height);

              // Depth Rings
              ctx.strokeStyle = isLight ? 'rgba(2, 132, 199, 0.25)' : 'rgba(14, 116, 144, 0.35)';
              ctx.lineWidth = 1.5;
              [100, 220, 360, 520].forEach(r => {
                ctx.beginPath();
                ctx.arc(width * 0.5, height * 0.5, r, 0, Math.PI * 2);
                ctx.stroke();
              });

                    <div className={`text-xs font-mono font-black text-amber-500 px-2 py-1 rounded border ${isLight ? 'bg-slate-100 border-slate-300' : 'bg-slate-900 border-slate-800'}`}>
                      {Math.round(activeUnit?.heading || 0)}°
                    </div>
                  </div>
                  <button
                    onClick={() => steerManual('right')}
                    className={`text-xs py-2 rounded-lg font-bold border transition ${isLight ? 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-slate-700' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200'}`}
                  >
                    TURN ▶ (D)
                  </button>
                  <div></div>
                  <button
                    onClick={() => steerManual('back')}
                    className={`text-xs py-2 rounded-lg font-bold border transition ${isLight ? 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-slate-700' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200'}`}
                  >
                    ▼ BRAKE (S)
                  </button>
                  <div></div>
                </div>

                {/* Weapons Fire Buttons */}
                <div className="space-y-1.5">
                  <button
                    onClick={() => fireWeapon('primary')}
                    className="w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 active:scale-95 text-slate-950 font-black text-xs py-2.5 rounded-lg shadow-lg transition flex items-center justify-center space-x-2"
                  >
                    <span>{activeUnit?.domain === 'ground' ? '💥' : (activeUnit?.domain === 'sea' ? '⚓' : '🔫')}</span>
                    <span>
                      {activeUnit?.domain === 'ground'
                        ? 'FIRE 120MM TANK SHELL [SPACE]'
                        : (activeUnit?.domain === 'sea' ? 'FIRE 76MM NAVAL GUN [SPACE]' : 'FIRE 20MM VULCAN CANNON [SPACE]')}
                    </span>
                  </button>

                  <button
                    onClick={() => fireWeapon('secondary')}
                    className="w-full bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 active:scale-95 text-white font-black text-xs py-2.5 rounded-lg shadow-lg transition flex items-center justify-center space-x-2"
                  >
                    <span>🚀</span>
                    <span>
                      {activeUnit?.domain === 'ground'
                        ? 'LAUNCH SAM AIR DEFENSE MISSILE [F]'
                        : (activeUnit?.domain === 'sea' ? 'LAUNCH CRUISE MISSILE [F]' : 'LAUNCH FOX-3 RADAR MISSILE [F]')}
                    </span>
                  </button>
                </div>
              </div>

              {/* 2. SELECTED UNIT TELEMETRY INSPECTOR */}
              <div className={`border rounded-xl p-3 ${bgCard}`}>
                <h3 className="text-xs font-bold text-sky-500 uppercase tracking-wider mb-2 flex items-center justify-between">
                  <span>Unit Telemetry Inspector</span>
                  <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                    activeUnit?.team === 'blue' ? 'bg-sky-500/20 text-sky-600 dark:text-sky-300' : 'bg-rose-500/20 text-rose-600 dark:text-rose-300'
                  }`}>
                    {activeUnit?.team?.toUpperCase()}
                  </span>
                </h3>
                <div className={`text-xs font-mono space-y-1.5 ${isLight ? 'text-slate-700' : 'text-slate-300'}`}>
                  <div className="flex justify-between"><span className={textMuted}>Callsign:</span> <b className="font-bold">{activeUnit?.id}</b></div>
                  <div className="flex justify-between"><span className={textMuted}>Platform:</span> <span className="text-sky-600 dark:text-sky-400 font-bold">{activeUnit?.class}</span></div>
                  <div className="flex justify-between"><span className={textMuted}>Position:</span> <span>X: {activeUnit?.x?.toFixed(1)} km | Y: {activeUnit?.y?.toFixed(1)} km</span></div>
                  <div className="flex justify-between"><span className={textMuted}>Speed / Alt:</span> <span>{Math.round(activeUnit?.speed || 0)} kts | Alt: {activeUnit?.alt?.toFixed(1)} km</span></div>
                  <div className="flex justify-between"><span className={textMuted}>Bearing:</span> <span>{Math.round(activeUnit?.heading || 0)}°</span></div>
                  
                  <div className="mt-2 pt-1.5 border-t border-slate-200 dark:border-slate-800">
                    <div className="flex justify-between text-[11px] mb-1">
                      <span>Structural Integrity:</span>
                      <b className="text-emerald-500">{Math.round(((activeUnit?.health || 0) / (activeUnit?.maxHealth || 100)) * 100)}%</b>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
                      <div
                        className="bg-emerald-500 h-full transition-all duration-200"
                        style={{ width: `${Math.round(((activeUnit?.health || 0) / (activeUnit?.maxHealth || 100)) * 100)}%` }}
                      />
                    </div>
                  </div>

                  <div className="mt-2 flex justify-between text-[11px] pt-1.5 border-t border-slate-200 dark:border-slate-800">
                    <span>Primary Ammo: <b className="text-sky-500">{activeUnit?.ammo}</b></span>
                    <span>Missiles: <b className="text-rose-500 font-bold">{activeUnit?.missiles}</b></span>
                  </div>
                </div>
              </div>

              {/* 3. TACTICAL OVERLAYS CHECKBOXES */}
              <div className={`border rounded-xl p-3 space-y-2 ${bgCard}`}>
                <h3 className="text-xs font-bold uppercase tracking-wider mb-2">Tactical Overlays</h3>
                {[
                  { id: 'radar', label: 'Show Radar Detection Cones' },
                  { id: 'wez', label: 'Show Weapon Engagement (WEZ)' },
                  { id: 'trails', label: 'Show Trajectory Trails' },
                  { id: 'grid', label: 'Show 10 km MGRS Grid' },
                  { id: 'terrain', label: 'Show High-Contrast Map Terrain' }
                ].map(t => (
                  <label key={t.id} className="flex items-center space-x-2 text-xs cursor-pointer hover:opacity-80">
                    <input
                      type="checkbox"
                      checked={toggles[t.id]}
                      onChange={(e) => setToggles(prev => ({ ...prev, [t.id]: e.target.checked }))}
                      className="rounded text-sky-600 focus:ring-0"
                    />
                    <span>{t.label}</span>
                  </label>
                ))}
              </div>

              {/* 4. SPEED PACING */}
              <div className={`border rounded-xl p-3 ${bgCard}`}>
                <h3 className="text-xs font-bold uppercase tracking-wider mb-2">Simulation Pacing</h3>
                <div className="grid grid-cols-4 gap-1.5 text-xs font-bold">
                  {[0.5, 1.0, 2.0, 5.0].map(s => (
                    <button
                      key={s}
                      onClick={() => setSimSpeed(s)}
                      className={`py-1.5 rounded-lg transition ${
                        simSpeed === s
                          ? 'bg-sky-600 text-white shadow'
                          : (isLight ? 'bg-slate-100 text-slate-700 hover:bg-slate-200' : 'bg-slate-800 text-slate-300 hover:bg-slate-700')
                      }`}
                    >
                      {s}x
                    </button>
                  ))}
                </div>
              </div>
            </aside>
          </div>

          {/* =============================================================== */}
          {/* BOTTOM STATUS FOOTER */}
          {/* =============================================================== */}
          <footer className={`h-10 border-t px-4 flex items-center justify-between text-xs font-mono z-10 shrink-0 ${bgHeader}`}>
            <div className="flex items-center space-x-3">
              <span>STEP: <b className="text-sky-600 dark:text-sky-400">{stepCount}</b></span>
              <span className={textMuted}>|</span>
              <span>MODE: <b className="text-emerald-500 font-bold">{isPlaying ? 'SIMULATE (50 Hz)' : 'PAUSED'}</b></span>
              <span className={`hidden md:inline ${textMuted}`}>|</span>
              <span className={`hidden md:inline ${textMuted}`}>Theme: <b className="text-amber-500">{theme.toUpperCase()}</b></span>
            </div>
            <div className="hidden lg:flex items-center space-x-3 text-slate-500">
              <span>Controls: [W/A/S/D] Steer | [Space] Fire Gun/Shell | [F] Missile | [1-9] Switch Unit | [M] Manual/Auto</span>
            </div>
          </footer>

          {/* =============================================================== */}
          {/* MODAL: CUSTOM FLEET & MAP BUILDER */}
          {/* =============================================================== */}
          {isCustomizerOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto ${bgCard}`}>
                
                <div className="flex items-center justify-between border-b pb-3 border-slate-200 dark:border-slate-800">
                  <div>
                    <h2 className="text-lg font-black text-amber-500 flex items-center space-x-2">
                      <span>🛠️</span>
                      <span>CUSTOM BATTLESPACE & FLEET BUILDER</span>
                    </h2>
                    <p className={`text-xs ${textMuted}`}>Choose map topography and customize Blue (Your side) & Red (Enemy) vehicles.</p>
                  </div>
                  <button onClick={() => setIsCustomizerOpen(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl font-bold p-1">✕</button>
                </div>

                {/* 1. Map Terrain Picker */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-sky-500 mb-2">1. Select Battlefield Map Terrain</label>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    {[
                      { id: 'archipelago', icon: '🏝️', title: 'Archipelago', desc: 'Islands & Sea Straits' },
                      { id: 'desert', icon: '🏜️', title: 'Desert Sands', desc: 'Open Armor Dunes' },
                      { id: 'mountain', icon: '⛰️', title: 'Mountain Ridge', desc: 'Radar Masking Canyons' },
                      { id: 'ocean', icon: '🌊', title: 'Deep Ocean', desc: 'Naval Fleet Arena' }
                    ].map(m => (
                      <div
                        key={m.id}
                        onClick={() => setMapTerrain(m.id)}
                        className={`cursor-pointer rounded-xl p-3 text-center transition flex flex-col items-center border ${
                          mapTerrain === m.id
                            ? 'border-2 border-sky-500 bg-sky-500/10 glow-sky'
                            : (isLight ? 'border-slate-300 bg-slate-50 hover:border-slate-400' : 'border-slate-800 bg-slate-900 hover:border-slate-700')
                        }`}
                      >
                        <span className="text-2xl mb-1">{m.icon}</span>
                        <span className="text-xs font-bold">{m.title}</span>
                        <span className={`text-[10px] ${textMuted}`}>{m.desc}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 2. Army Composition Controls (Blue vs Red) */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* Blue Forces */}
                  <div className={`border rounded-xl p-4 space-y-3 ${isLight ? 'bg-sky-50/50 border-sky-200' : 'bg-slate-900/50 border-sky-900/50'}`}>
                    <div className="flex items-center justify-between border-b pb-2 border-sky-500/30">
                      <span className="font-black text-xs text-sky-600 dark:text-sky-400 tracking-wide">🔵 BLUE FORCES (YOUR SIDE)</span>
                      <span className="text-[11px] font-mono font-bold text-sky-600">
                        {fleetConfig.blue.ac1 + fleetConfig.blue.ac2 + fleetConfig.blue.tank + fleetConfig.blue.ship} Units
                      </span>
                    </div>

                    {[
                      { key: 'ac1', icon: '✈️', name: 'AC1 Air Fighters' },
                      { key: 'ac2', icon: '🚀', name: 'AC2 Interceptors' },
                      { key: 'tank', icon: '🛡️', name: 'SAM Mobile Tanks' },
                      { key: 'ship', icon: '🚢', name: 'Combat Warships' }
                    ].map(u => (
                      <div key={u.key} className="flex items-center justify-between text-xs">
                        <span className="font-bold">{u.icon} {u.name}</span>
                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => setFleetConfig(prev => ({
                              ...prev,
                              blue: { ...prev.blue, [u.key]: Math.max(0, prev.blue[u.key] - 1) }
                            }))}
                            className={`px-2.5 py-1 rounded font-bold ${isLight ? 'bg-slate-200 hover:bg-slate-300' : 'bg-slate-800 hover:bg-slate-700'}`}
                          >
                            -
                          </button>
                          <span className="font-mono font-bold text-sm w-4 text-center">{fleetConfig.blue[u.key]}</span>
                          <button
                            onClick={() => setFleetConfig(prev => ({
                              ...prev,
                              blue: { ...prev.blue, [u.key]: Math.min(8, prev.blue[u.key] + 1) }
                            }))}
                            className={`px-2.5 py-1 rounded font-bold ${isLight ? 'bg-slate-200 hover:bg-slate-300' : 'bg-slate-800 hover:bg-slate-700'}`}
                          >
                            +
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Red Forces */}
                  <div className={`border rounded-xl p-4 space-y-3 ${isLight ? 'bg-rose-50/50 border-rose-200' : 'bg-slate-900/50 border-rose-900/50'}`}>
                    <div className="flex items-center justify-between border-b pb-2 border-rose-500/30">
                      <span className="font-black text-xs text-rose-600 dark:text-rose-400 tracking-wide">🔴 RED FORCES (ENEMY SIDE)</span>
                      <span className="text-[11px] font-mono font-bold text-rose-600">
                        {fleetConfig.red.ac1 + fleetConfig.red.ac2 + fleetConfig.red.tank + fleetConfig.red.ship} Units
                      </span>
                    </div>

                    {[
                      { key: 'ac1', icon: '✈️', name: 'Red Fighters' },
                      { key: 'ac2', icon: '🚀', name: 'Red Interceptors' },
                      { key: 'tank', icon: '🛡️', name: 'Red SAM Tanks' },
                      { key: 'ship', icon: '🚢', name: 'Red Corvettes' }
                    ].map(u => (
                      <div key={u.key} className="flex items-center justify-between text-xs">
                        <span className="font-bold">{u.icon} {u.name}</span>
                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => setFleetConfig(prev => ({
                              ...prev,
                              red: { ...prev.red, [u.key]: Math.max(0, prev.red[u.key] - 1) }
                            }))}
                            className={`px-2.5 py-1 rounded font-bold ${isLight ? 'bg-slate-200 hover:bg-slate-300' : 'bg-slate-800 hover:bg-slate-700'}`}
                          >
                            -
                          </button>
                          <span className="font-mono font-bold text-sm w-4 text-center">{fleetConfig.red[u.key]}</span>
                          <button
                            onClick={() => setFleetConfig(prev => ({
                              ...prev,
                              red: { ...prev.red, [u.key]: Math.min(8, prev.red[u.key] + 1) }
                            }))}
                            className={`px-2.5 py-1 rounded font-bold ${isLight ? 'bg-slate-200 hover:bg-slate-300' : 'bg-slate-800 hover:bg-slate-700'}`}
                          >
                            +
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Quick Presets */}
                <div>
                  <label className={`block text-xs font-bold uppercase tracking-wider mb-1.5 ${textMuted}`}>Quick Presets</label>
                  <div className="flex flex-wrap gap-2 text-xs font-bold">
                    {[
                      {
                        label: '⚡ Tri-Service Joint (Combined Arms)',
                        cfg: { blue: { ac1: 1, ac2: 1, tank: 1, ship: 1 }, red: { ac1: 1, ac2: 1, tank: 1, ship: 1 } }
                      },
                      {
                        label: '✈️ Pure Air Dogfight (3v3)',
                        cfg: { blue: { ac1: 2, ac2: 1, tank: 0, ship: 0 }, red: { ac1: 2, ac2: 1, tank: 0, ship: 0 } }
                      },
                      {
                        label: '🛡️ Armor Blitz (Tanks vs SAMs)',
                        cfg: { blue: { ac1: 1, ac2: 0, tank: 3, ship: 0 }, red: { ac1: 0, ac2: 1, tank: 3, ship: 0 } }
                      },
                      {
                        label: '🚢 Naval Task Force (Ships + Air)',
                        cfg: { blue: { ac1: 1, ac2: 0, tank: 0, ship: 2 }, red: { ac1: 1, ac2: 0, tank: 0, ship: 2 } }
                      }
                    ].map(p => (
                      <button
                        key={p.label}
                        onClick={() => setFleetConfig(p.cfg)}
                        className={`px-3 py-1.5 rounded-lg border transition ${isLight ? 'bg-slate-100 hover:bg-slate-200 border-slate-300' : 'bg-slate-800 hover:bg-slate-700 border-slate-700'}`}
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Deploy Button */}
                <div className="border-t pt-3 border-slate-200 dark:border-slate-800">
                  <button
                    onClick={() => {
                      setIsCustomizerOpen(false);
                      initFleet(fleetConfig, mapTerrain);
                      showToast(`🚀 DEPLOYED ${mapTerrain.toUpperCase()} BATTLESPACE!`);
                    }}
                    className="w-full bg-gradient-to-r from-emerald-500 to-sky-500 hover:from-emerald-400 hover:to-sky-400 text-slate-950 font-black text-sm py-3 rounded-xl shadow-lg transition glow-green flex items-center justify-center space-x-2"
                  >
                    <span>🚀</span>
                    <span>DEPLOY CUSTOM BATTLESPACE NOW</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React 18 Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TacticalSimulatorApp />);
  </script>
</body>
</html>
